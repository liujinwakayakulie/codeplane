# Railway/Nixpacks 部署配置
#
# 默认 Nixpacks 检测到 package-lock.json 会用 `npm ci`，但本项目 lockfile
# 里的 platform-specific optional deps（@emnapi/*, @img/sharp-linux-* 等）
# 在 macOS 上生成时不完整，导致 Linux 容器里 `npm ci` 严格校验失败。
#
# 改用 `npm install`，npm 会容忍 lockfile 缺失并按需补齐跨平台依赖。

[phases.install]
cmds = ["npm install --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
